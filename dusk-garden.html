<title>باغچه‌ی غروب</title>
<meta name="description" content="Dusk Garden: rotate paper channels so spring water reaches every flower.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: one phone-width column over a painted dusk sky; paper tray board in the middle,
   paper chips above and below. Style "Dusk Paper Garden": one key light at top-left (the moon),
   every surface is the same cut-paper recipe (shadow → lip → face → gloss). Single dark world by choice. */
:root {
  color-scheme: dark;
  --night: #1b1530;
  --sky-top: #231a40;
  --sky-low: #5a3366;
  --glow: #e88d77;
  --ink: #f6ead8;
  --muted: #bfaecf;
  --paper-hi: #fbf0dc;
  --paper: #ecd9b9;
  --paper-lip: #b3916c;
  --paper-ink: #3b2840;
  --hole: #d4bd98;
  --water: #5fd8d2;
  --gold: #ffc94a;
  --gold-deep: #e39a1c;
  --shadow: rgba(10, 5, 28, .55);
  --display: "Lalezar", "Vazirmatn", "Tahoma", system-ui, sans-serif;
  --body: "Vazirmatn", "Tahoma", system-ui, sans-serif;
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  --ease-out: cubic-bezier(.22, .61, .36, 1);
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  direction: rtl; overflow: hidden; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
#sky, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#sky { z-index: 0; }
#fx { z-index: 30; pointer-events: none; }

.app {
  position: relative; z-index: 1; height: 100%; max-width: 460px; margin: 0 auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 14px 18px; box-sizing: border-box;
}

/* ---- the paper recipe, shared by every DOM surface ---- */
.paper {
  background: linear-gradient(180deg, var(--paper-hi) 0%, var(--paper) 100%);
  color: var(--paper-ink);
  box-shadow: 0 4px 0 var(--paper-lip), 3px 9px 14px var(--shadow);
  position: relative;
}
.paper::after { /* gloss: from the top edge to 55% of the face */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 55%);
}

header.bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding-inline: 14px;
  border-radius: 999px; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
  white-space: nowrap; box-sizing: border-box;
}
.chip svg { width: 22px; height: 22px; flex: none; }
.level { justify-self: start; font-family: var(--display); font-weight: 400; font-size: 18px; padding-top: 3px; }
.coins { justify-self: end; }
.bloomcount { font-size: 17px; padding-inline: 16px; }
.bloomcount b { font-weight: 800; }

.hint { transition: opacity 200ms ease-out; text-align: center; color: var(--muted); font-size: 14px; margin: 2px 0 0; text-wrap: balance; }
.hint strong { color: var(--ink); font-weight: 600; }

.boardwrap { flex: 1; min-height: 0; display: grid; place-items: center; }
#board { display: block; border-radius: 26px; outline: none; touch-action: none; }

footer.bar { display: flex; align-items: center; gap: 10px; }
.moves { margin-inline-end: auto; }
.moves .par { color: #7b6680; font-weight: 600; }
.ibtn {
  width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  display: grid; place-items: center; transition: transform 130ms var(--ease-out);
}
.ibtn svg { width: 24px; height: 24px; position: relative; z-index: 1; }
.ibtn:active, .btn:active { transform: scale(.94) translateY(2px); }
.ibtn:focus-visible, .btn:focus-visible, #board:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

/* ---- completion sheet ---- */
#board { transform-origin: 50% 0; }
#sheet {
  position: fixed; z-index: 21; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(428px, calc(100% - 32px)); transform: translate(-50%, 130%);
  border-radius: 30px; padding: 22px 20px 20px; box-sizing: border-box;
  box-shadow: 0 7px 0 var(--paper-lip), 4px 16px 30px var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
#sheet[hidden] { display: none !important; }
#sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.2; color: var(--paper-ink); text-wrap: balance; }
#sheet .sub { margin: -6px 0 0; font-size: 14px; color: #7b6680; font-variant-numeric: tabular-nums; }
.stars { display: flex; gap: 10px; direction: ltr; align-items: flex-end; height: 74px; }
.star { position: relative; width: 64px; height: 64px; }
.star:nth-child(2) { width: 74px; height: 74px; }
.star svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.star .fill { transform-origin: 50% 55%; transform: scale(0); }
.payrow {
  display: flex; align-items: center; gap: 8px; height: 46px; padding-inline: 18px; border-radius: 999px;
  background: rgba(59, 40, 64, .08); box-shadow: inset 2px 3px 0 rgba(59,40,64,.12);
  font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--paper-ink);
}
.payrow svg { width: 28px; height: 28px; }
.actions { display: flex; gap: 10px; width: 100%; margin-top: 4px; }
.btn {
  flex: 1; height: 54px; border: 0; border-radius: 999px; cursor: pointer;
  font-family: var(--display); font-size: 21px; padding-top: 3px; transition: transform 130ms var(--ease-out);
}
.btn.primary {
  flex: 1.6; color: #3b1f08;
  background: linear-gradient(180deg, #ffe08a 0%, var(--gold) 100%);
  box-shadow: 0 4px 0 var(--gold-deep), 3px 9px 14px var(--shadow);
}
.btn.ghost { background: rgba(59,40,64,.08); color: var(--paper-ink); box-shadow: inset 0 -3px 0 rgba(59,40,64,.12); }
.actions .btn { transform: scale(0); }

#toast {
  position: fixed; z-index: 25; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 0); height: 40px; padding-inline: 18px; border-radius: 999px;
  display: flex; align-items: center; font-weight: 600; font-size: 14px; white-space: nowrap;
}
#toast[hidden] { display: none !important; }

.enter { animation: enter 620ms both; }
@keyframes enter {
  0% { opacity: 0; transform: translateY(28px) scale(.94); animation-timing-function: var(--ease-out); }
  55% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
.motion-off .enter { animation: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<div class="app" id="app">
  <header class="bar enter">
    <div class="chip paper level" id="levelChip">مرحله‌ی ۱</div>
    <div class="chip paper bloomcount" id="bloomChip" aria-hidden="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g transform="translate(12 12)">
          <ellipse cx="0" cy="-6" rx="3.6" ry="5.6" fill="#ff7a6b"/><ellipse cx="0" cy="-6" rx="3.6" ry="5.6" fill="#ff7a6b" transform="rotate(72)"/>
          <ellipse cx="0" cy="-6" rx="3.6" ry="5.6" fill="#ff7a6b" transform="rotate(144)"/><ellipse cx="0" cy="-6" rx="3.6" ry="5.6" fill="#ff7a6b" transform="rotate(216)"/>
          <ellipse cx="0" cy="-6" rx="3.6" ry="5.6" fill="#ff7a6b" transform="rotate(288)"/><circle r="3.4" fill="#ffc94a"/>
        </g>
      </svg>
      <span><b id="bloomNum">۰</b> از <span id="bloomTot">۴</span></span>
    </div>
    <div class="chip paper coins" id="coinChip">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12.8" r="9" fill="#e39a1c"/><circle cx="12" cy="11.2" r="9" fill="#ffc94a"/><circle cx="12" cy="11.2" r="5.4" fill="none" stroke="#e39a1c" stroke-width="1.6"/><path d="M8 7.5a6 6 0 0 1 5-2" stroke="#fff6d6" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      <span id="coinNum">۰</span>
    </div>
  </header>
  <p class="hint enter" style="animation-delay:60ms">کاشی‌ها را بچرخان تا آب چشمه به <strong>همه‌ی گل‌ها</strong> برسد.</p>
  <div class="boardwrap"><canvas id="board" tabindex="0" role="application" aria-label="صفحه‌ی بازی؛ با کلیدهای جهت حرکت کن و با فاصله کاشی را بچرخان"></canvas></div>
  <footer class="bar enter" style="animation-delay:120ms">
    <div class="chip paper moves" id="movesChip">حرکت <span id="moveNum">۰</span>&nbsp;<span class="par">· هدف <span id="parNum">۰</span></span></div>
    <button class="ibtn paper" id="btnRestart" aria-label="شروع دوباره‌ی مرحله" title="شروع دوباره">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3b2840" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5"/><path d="M4 4.5v4h4"/></svg>
    </button>
    <button class="ibtn paper" id="btnSound" aria-label="صدا: روشن" title="صدا">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3b2840" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#3b2840"/><path id="soundWaves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path id="soundX" d="M16 9.5l5 5M21 9.5l-5 5" visibility="hidden"/></svg>
    </button>
    <button class="ibtn paper" id="btnMotion" aria-label="حرکت: خودکار" title="حرکت">
      <svg viewBox="0 0 24 24" fill="none" stroke="#3b2840" stroke-width="2.2" stroke-linecap="round"><path d="M3 12c2.5-5 5.5-5 8 0s5.5 5 8 0" id="motionWave"/><path d="M3 12h18" id="motionFlat" visibility="hidden"/><circle cx="21" cy="12" r="1.4" fill="#3b2840"/></svg>
    </button>
  </footer>
</div>

<section id="sheet" class="paper" hidden aria-live="polite">
  <div class="stars" id="stars"></div>
  <h2>باغ سیراب شد!</h2>
  <p class="sub" id="sheetSub">در ۰ حرکت · هدف ۰</p>
  <div class="payrow" id="payrow">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12.8" r="9" fill="#e39a1c"/><circle cx="12" cy="11.2" r="9" fill="#ffc94a"/><circle cx="12" cy="11.2" r="5.4" fill="none" stroke="#e39a1c" stroke-width="1.6"/></svg>
    <span id="payNum">+۰</span>
  </div>
  <div class="actions">
    <button class="btn primary" id="btnNext">مرحله‌ی بعد</button>
    <button class="btn ghost" id="btnReplay">دوباره</button>
  </div>
</section>
<div id="toast" class="paper" hidden></div>
<div class="sr" id="live" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
"use strict";
// ---------- utilities ----------
const fa = v => String(v).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
const clamp01 = t => t < 0 ? 0 : t > 1 ? 1 : t;
const eOC = t => 1 - Math.pow(1 - t, 3);
const eIC = t => t * t * t;
const eOB = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const eIQ = t => t * t;
const tw = (from, to, t0, dur, ease) => ({ from, to, t0, dur, ease });
const tv = (o, now) => { if (o.dur <= 0) return o.to; const p = clamp01((now - o.t0) / o.dur); return o.from + (o.to - o.from) * o.ease(p); };
const tdone = (o, now) => o.dur <= 0 || now >= o.t0 + o.dur;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const $ = id => document.getElementById(id);
const store = {
  get() { try { return JSON.parse(localStorage.getItem("dusk-garden") || "null"); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem("dusk-garden", JSON.stringify(v)); } catch (e) {} }
};

// ---------- motion setting: Auto / On / Off ----------
const mq = matchMedia("(prefers-reduced-motion: reduce)");
let motionMode = "auto";
const reduce = () => motionMode === "off" || (motionMode === "auto" && mq.matches);

// ---------- model ----------
const W = 5, H = 6;
const DIRS = [[0, -1, 1, 4], [1, 0, 2, 8], [0, 1, 4, 1], [-1, 0, 8, 2]]; // dx, dy, bit, opposite
const rotm = (m, k) => { k = ((k % 4) + 4) % 4; for (let i = 0; i < k; i++) m = ((m << 1) | (m >> 3)) & 15; return m; };
const FLOWER_COLORS = [["#ff7a6b", "#ffb0a2"], ["#ffb547", "#ffe0a0"], ["#b48cff", "#dccbff"], ["#ff8fb8", "#ffd0e2"]];

let level = 1, coins = 0, pendingCoins = 0;
let tiles = [], src = null, flowers = [], par = 0, moves = 0;
let won = false, showPending = false, showing = false, settledShow = false;
let shownBlooms = 0, run = 0, lastInput = performance.now();

function generate(lv) {
  const rnd = mulberry32(lv * 9973 + 17);
  const idx = (x, y) => y * W + x;
  const sol = new Array(W * H).fill(0), inT = new Array(W * H).fill(false);
  const s = { x: 2, y: 2 + Math.floor(rnd() * 2) };
  inT[idx(s.x, s.y)] = true;
  const front = [];
  const addF = (x, y) => DIRS.forEach(([dx, dy, b, o]) => { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < W && ny < H) front.push([x, y, nx, ny, b, o]); });
  addF(s.x, s.y);
  while (front.length) {
    const [x, y, nx, ny, b, o] = front.splice(Math.floor(rnd() * front.length), 1)[0];
    if (inT[idx(nx, ny)]) continue;
    inT[idx(nx, ny)] = true; sol[idx(x, y)] |= b; sol[idx(nx, ny)] |= o; addF(nx, ny);
  }
  // depth along the solution tree
  const depth = new Array(W * H).fill(-1); depth[idx(s.x, s.y)] = 0;
  const q = [[s.x, s.y]];
  while (q.length) { const [x, y] = q.shift(); DIRS.forEach(([dx, dy, b]) => { if (sol[idx(x, y)] & b) { const n = idx(x + dx, y + dy); if (depth[n] < 0) { depth[n] = depth[idx(x, y)] + 1; q.push([x + dx, y + dy]); } } }); }
  // flowers: the farthest leaves, spread apart
  const leaves = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const m = sol[idx(x, y)]; if (!(x === s.x && y === s.y) && (m & (m - 1)) === 0) leaves.push({ x, y, d: depth[idx(x, y)] }); }
  leaves.sort((a, b) => b.d - a.d || a.y - b.y || a.x - b.x);
  const picked = [];
  for (const minGap of [3, 2, 1]) { for (const l of leaves) { if (picked.length >= 4) break; if (picked.includes(l)) continue; if (picked.every(p => Math.abs(p.x - l.x) + Math.abs(p.y - l.y) >= minGap)) picked.push(l); } }
  let out;
  for (let attempt = 0; attempt < 20; attempt++) {
    out = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = idx(x, y), r = Math.floor(rnd() * 4), base = rotm(sol[i], r);
      const fi = picked.findIndex(p => p.x === x && p.y === y);
      out.push({ x, y, sol: sol[i], base, turns: 0, ang: 0, vel: 0, depthSol: depth[i], isSrc: x === s.x && y === s.y,
        flower: fi < 0 ? null : { color: FLOWER_COLORS[fi % 4], b: tw(0, 0, 0, 0, eOC), bloomed: false, counted: false, flight: null, phase: fi * 1.7 },
        w: tw(0, 0, 0, 0, eOC), wet: false, depth: -1, press: tw(1, 1, 0, 0, eOC), appear: tw(1, 1, 0, 0, eOC) });
    }
    const t0 = out; tiles = t0; src = tiles.find(t => t.isSrc);
    if (!computeWater().allFlowers) break;
  }
  tiles = out; src = tiles.find(t => t.isSrc); flowers = tiles.filter(t => t.flower);
  par = tiles.reduce((acc, t) => { for (let k = 0; k < 4; k++) if (rotm(t.base, k) === t.sol) return acc + k; return acc; }, 0);
}
const cur = t => rotm(t.base, t.turns);
const tileAt = (x, y) => (x >= 0 && y >= 0 && x < W && y < H) ? tiles[y * W + x] : null;

function computeWater() {
  tiles.forEach(t => t.depthNew = -1);
  src.depthNew = 0; const q = [src];
  while (q.length) {
    const t = q.shift(), m = cur(t);
    DIRS.forEach(([dx, dy, b, o]) => { const n = tileAt(t.x + dx, t.y + dy); if (n && (m & b) && (cur(n) & o) && n.depthNew < 0) { n.depthNew = t.depthNew + 1; q.push(n); } });
  }
  return { allFlowers: tiles.filter(t => t.flower).every(t => t.depthNew >= 0) };
}

// ---------- sound ----------
let soundOn = true, actx = null;
function ac() { if (!soundOn) return null; if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } } if (actx.state === "suspended") actx.resume(); return actx; }
function tone(freq, dur, gain, type = "sine", when = 0, bend = 1) {
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (bend !== 1) o.frequency.exponentialRampToValueAtTime(freq * bend, t + dur);
  f.type = "lowpass"; f.frequency.value = 3200;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
const sfx = {
  turn() { tone(330, 0.07, 0.05, "triangle", 0, 0.7); },
  bloom(step) { const f = 523.25 * Math.pow(2, PENTA[Math.min(step, PENTA.length - 1)] / 12); tone(f, 0.55, 0.07); tone(f * 2, 0.3, 0.02, "triangle"); },
  land() { tone(1318, 0.12, 0.03, "sine"); },
  wilt() { tone(260, 0.18, 0.04, "sine", 0, 0.75); },
  star(i) { const f = [784, 988, 1175][i]; tone(f, 0.9, 0.06); tone(f * 1.5, 0.6, 0.02, "triangle"); },
  tick() { tone(1568, 0.04, 0.015, "square"); },
  coin() { tone(1760, 0.18, 0.04); tone(2637, 0.22, 0.025, "triangle", 0.05); }
};

// ---------- canvases ----------
const sky = $("sky"), skx = sky.getContext("2d");
const board = $("board"), bx = board.getContext("2d");
const fx = $("fx"), fxx = fx.getContext("2d");
let DPR = 1, cell = 60, pad = 12, vw = 0, vh = 0;
function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  vw = innerWidth; vh = innerHeight;
  [sky, fx].forEach(c => { c.width = Math.round(vw * DPR); c.height = Math.round(vh * DPR); });
  const wrap = board.parentElement, aw = wrap.clientWidth, ah = wrap.clientHeight;
  cell = Math.floor(Math.min((aw - 4) / (W + 0.4), (ah - 4) / (H + 0.4), 86));
  pad = Math.round(cell * 0.2);
  const cw = cell * W + pad * 2, ch = cell * H + pad * 2;
  board.style.width = cw + "px"; board.style.height = ch + "px";
  board.width = Math.round(cw * DPR); board.height = Math.round(ch * DPR);
  paintSkyStatic();
}

// static sky layer (moon = the key light, top-left)
let skyStatic = null;
function paintSkyStatic() {
  skyStatic = document.createElement("canvas"); skyStatic.width = sky.width; skyStatic.height = sky.height;
  const c = skyStatic.getContext("2d"); c.scale(DPR, DPR);
  const g = c.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, "#1b1530"); g.addColorStop(0.45, "#2a1d48"); g.addColorStop(0.78, "#5a3366"); g.addColorStop(1, "#a0566a");
  c.fillStyle = g; c.fillRect(0, 0, vw, vh);
  const mx = vw * 0.2, my = vh * 0.2, mr = Math.min(vw, vh) * 0.055;
  const halo = c.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 7);
  halo.addColorStop(0, "rgba(255,226,190,.28)"); halo.addColorStop(1, "rgba(255,226,190,0)");
  c.fillStyle = halo; c.fillRect(0, 0, vw, vh);
  c.fillStyle = "#fff1d8"; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
  c.fillStyle = "rgba(220,190,160,.35)"; c.beginPath(); c.arc(mx + mr * .3, my + mr * .15, mr * .22, 0, 7); c.fill(); c.beginPath(); c.arc(mx - mr * .35, my - mr * .3, mr * .13, 0, 7); c.fill();
  const r = mulberry32(7);
  for (let i = 0; i < 70; i++) { const x = r() * vw, y = r() * vh * 0.55, s = r() * 1.3 + 0.3; c.fillStyle = `rgba(255,240,220,${0.25 + r() * 0.5})`; c.beginPath(); c.arc(x, y, s, 0, 7); c.fill(); }
