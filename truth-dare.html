<title>حقیقت یا جرئت</title>
<meta name="description" content="Truth or Dare: spin a glass bottle on a Persian carpet and take your turn.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;900&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
/* Layout: a phone column over a dark room; the Persian carpet is the table, seen from above.
   Style "Dowreh Carpet": one warm lamp at top-left lights carpet, bottle and cards alike;
   every panel is ivory card stock (contact shadow → lip → face → top gloss). Single dark world by choice. */
:root {
  color-scheme: dark;
  --room: #15101c;
  --madder: #9b2226;
  --madder-deep: #5e1216;
  --navy: #1f2b4d;
  --navy-deep: #121a33;
  --ivory: #f3e7cc;
  --ivory-lo: #e6d4ae;
  --ivory-lip: #b39465;
  --saffron: #eaa632;
  --saffron-hi: #ffd479;
  --saffron-deep: #a8681a;
  --truth: #2f4f9a;
  --truth-hi: #5a7fd6;
  --dare: #c2361c;
  --dare-hi: #ff7a3d;
  --ink: #2a1a1a;
  --ink-soft: #77605a;
  --cream: #f6ead2;
  --muted: #b9a8b2;
  --good: #2f9e6c;
  --shadow: rgba(8, 4, 12, .6);
  --display: "Noto Kufi Arabic", "Vazirmatn", "Tahoma", sans-serif;
  --body: "Vazirmatn", "Tahoma", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--room); color: var(--cream); font-family: var(--body); direction: rtl; overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--saffron-hi); outline-offset: 3px; }
#room, #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; }
#room { z-index: 0; } #fx { z-index: 60; }

.ivory {
  background: linear-gradient(180deg, #fffaf0 0%, var(--ivory) 40%, var(--ivory-lo) 100%); color: var(--ink);
  box-shadow: 0 5px 0 var(--ivory-lip), 3px 12px 22px var(--shadow); position: relative;
}
.gold {
  background: linear-gradient(180deg, var(--saffron-hi) 0%, var(--saffron) 75%); color: #3b1d04;
  box-shadow: 0 4px 0 var(--saffron-deep), 2px 9px 16px var(--shadow); position: relative;
}
.ivory::after, .gold::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255,255,255,.5) 0%, rgba(255,255,255,0) 50%);
}
.press { border: 0; cursor: pointer; transition: transform 130ms cubic-bezier(.22,.61,.36,1); }
.press:active:not(:disabled) { transform: scale(.94) translateY(2px); }
.press:disabled { cursor: default; filter: saturate(.3) brightness(.9); opacity: .8; }

.screen {
  position: fixed; inset: 0; z-index: 5; max-width: 480px; margin-inline: auto; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 12px;
  padding-inline: 16px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
}
.screen[hidden] { display: none !important; }

/* ---------- setup ---------- */
#setup { overflow-y: auto; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 6px; }
.brand svg { width: 150px; height: 64px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 36px; line-height: 1.5; text-align: center; color: var(--cream); text-shadow: 0 3px 0 rgba(0,0,0,.4); }
.brand h1 .t { color: #9fb8ff; } .brand h1 .d { color: #ff9a6a; }
.brand p { margin: -4px 0 0; color: var(--muted); font-size: 14px; }
.panel { border-radius: 26px; padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; flex: none; }
.field { display: flex; flex-direction: column; gap: 8px; }
.lbl { font-weight: 800; font-size: 14px; color: var(--ink-soft); display: flex; justify-content: space-between; }
.lbl small { font-weight: 600; }
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prow { display: flex; align-items: center; gap: 6px; height: 48px; padding-inline: 6px 4px; border-radius: 14px; background: rgba(60,30,20,.07); box-shadow: inset 0 2px 0 rgba(60,30,20,.1); min-width: 0; }
.prow .dot { width: 28px; height: 28px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 13px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
.prow input { flex: 1; min-width: 0; height: 38px; border: 0; background: transparent; color: var(--ink); font: 800 15px var(--body); outline: none; border-radius: 8px; padding-inline: 4px; }
.prow input:focus { background: rgba(255,255,255,.6); }
.prow .rm { width: 32px; height: 32px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; display: grid; place-items: center; flex: none; }
.prow .rm svg { width: 16px; height: 16px; }
.addp { height: 48px; border-radius: 14px; border: 2px dashed rgba(60,30,20,.25); background: transparent; color: var(--ink-soft); font-weight: 800; font-size: 14px; cursor: pointer; }
.levels { display: grid; gap: 8px; }
.lvl {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 0; cursor: pointer; text-align: start;
  background: rgba(60,30,20,.06); box-shadow: inset 0 0 0 1.5px rgba(60,30,20,.14); color: var(--ink); transition: transform 130ms;
}
.lvl:active { transform: scale(.97); }
.lvl .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: rgba(60,30,20,.08); }
.lvl .ic svg { width: 24px; height: 24px; }
.lvl b { display: block; font-size: 16px; font-weight: 800; }
.lvl span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; }
.lvl[aria-pressed="true"] { background: linear-gradient(180deg, #fff4dc, #ffe4a8); box-shadow: inset 0 0 0 2px var(--saffron), 0 3px 0 var(--saffron-deep); }
.lvl[aria-pressed="true"] .ic { background: var(--saffron); }
.seg { display: flex; gap: 6px; padding: 5px; border-radius: 16px; background: rgba(60,30,20,.08); box-shadow: inset 0 2px 0 rgba(60,30,20,.1); flex: 1; }
.seg button { flex: 1; height: 40px; white-space: nowrap; font-size: 13px !important; border-radius: 12px; border: 0; background: transparent; color: var(--ink-soft); font-weight: 800; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: linear-gradient(180deg, var(--saffron-hi), var(--saffron)); color: #3b1d04; box-shadow: 0 3px 0 var(--saffron-deep); }
.prefs { display: flex; gap: 8px; }
.cta { height: 62px; border-radius: 999px; font-family: var(--display); font-weight: 900; font-size: 22px; flex: none; }
#setup > .cta { position: sticky; bottom: 0; z-index: 2; }

/* ---------- table ---------- */
#table { gap: 8px; }
.topbar { display: flex; align-items: center; gap: 8px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 44px; padding-inline: 14px; border-radius: 999px; font-weight: 800; font-size: 14px; white-space: nowrap; }
.chip svg { width: 22px; height: 22px; position: relative; z-index: 1; }
.chip > * { position: relative; z-index: 1; }
.turnchip { margin-inline-end: auto; }
.turnchip .lv { color: var(--ink-soft); font-weight: 600; }
.ib { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; padding: 0; }
.ib svg { width: 22px; height: 22px; position: relative; z-index: 1; }
.tablewrap { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
#carpet { display: block; touch-action: none; cursor: grab; border-radius: 6px; }
#carpet:focus-visible { outline: 3px solid var(--saffron-hi); outline-offset: 6px; }
.hint { text-align: center; margin: 0; font-size: 14px; color: var(--muted); min-height: 22px; flex: none; }
.hint b { color: var(--cream); }
.spinbtn { height: 60px; border-radius: 999px; font-family: var(--display); font-weight: 900; font-size: 21px; display: flex; align-items: center; justify-content: center; gap: 10px; flex: none; }
.spinbtn svg { width: 26px; height: 26px; position: relative; z-index: 1; }
.spinbtn span { position: relative; z-index: 1; }

/* ---------- sheets ---------- */
.sheet {
  position: fixed; z-index: 20; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin-inline: auto;
  width: min(448px, calc(100% - 32px)); max-height: calc(100% - 40px); box-sizing: border-box;
  border-radius: 28px; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 12px;
}
.sheet[hidden] { display: none !important; }
.who { display: flex; align-items: center; justify-content: center; gap: 10px; }
.who .av { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 20px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.2); }
.who h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.5; }
.asker { text-align: center; margin: -8px 0 0; font-size: 13px; color: var(--ink-soft); }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice {
  position: relative; height: 184px; border-radius: 22px; border: 0; cursor: pointer; overflow: hidden; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px;
  transition: transform 130ms cubic-bezier(.22,.61,.36,1);
}
.choice:active { transform: scale(.95) translateY(2px); }
.choice.truth { background: radial-gradient(circle at 50% 38%, var(--truth-hi), var(--truth) 62%, #1c2f61); box-shadow: 0 5px 0 #15234a, 3px 12px 22px var(--shadow); }
.choice.dare { background: radial-gradient(circle at 50% 38%, var(--dare-hi), var(--dare) 62%, #7d1e0e); box-shadow: 0 5px 0 #5c1508, 3px 12px 22px var(--shadow); }
.choice::before { content: ""; position: absolute; inset: 8px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,.35); pointer-events: none; }
.choice::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 50%); pointer-events: none; }
.choice svg { width: 64px; height: 64px; }
.choice b { font-family: var(--display); font-weight: 900; font-size: 27px; line-height: 1.3; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.choice small { font-size: 12.5px; font-weight: 600; opacity: .9; }
.row2 { display: flex; gap: 10px; }
.row2 > button { flex: 1; height: 50px; border-radius: 999px; font-weight: 800; font-size: 15px; }
.ghost { background: rgba(60,30,20,.08); color: var(--ink); box-shadow: inset 0 -3px 0 rgba(60,30,20,.12); }
.passes { text-align: center; font-size: 13px; color: var(--ink-soft); margin: -4px 0 0; }

/* the flipping card */
.flip { perspective: 1200px; height: 300px; }
.flipin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateY(0deg); }
.face { position: absolute; inset: 0; border-radius: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 18px; box-sizing: border-box; text-align: center; overflow: hidden; }
.face.front { color: #fff; }
.face.front.truth { background: radial-gradient(circle at 50% 38%, var(--truth-hi), var(--truth) 62%, #1c2f61); }
.face.front.dare { background: radial-gradient(circle at 50% 38%, var(--dare-hi), var(--dare) 62%, #7d1e0e); }
.face.front svg { width: 96px; height: 96px; }
.face.front b { font-family: var(--display); font-weight: 900; font-size: 36px; }
.face.back { transform: rotateY(180deg); color: var(--ink); background: linear-gradient(180deg, #fffaf0, var(--ivory) 45%, var(--ivory-lo)); gap: 12px; }
.face.back::before { content: ""; position: absolute; inset: 9px; border-radius: 15px; border: 2px solid var(--frame, var(--truth)); opacity: .55; pointer-events: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding-inline: 14px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 13px; }
.tag svg { width: 16px; height: 16px; }
.prompt { font-family: var(--display); font-weight: 700; line-height: 1.75; color: var(--ink); text-wrap: balance; }
.prompt.l1 { font-size: 23px; } .prompt.l2 { font-size: 20px; } .prompt.l3 { font-size: 17px; }
.prompt .nm { color: var(--madder); font-weight: 900; }
.facefoot { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.timerbtn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-inline: 12px 16px; border-radius: 999px; background: rgba(60,30,20,.08); border: 0; cursor: pointer; font-weight: 800; font-size: 14px; color: var(--ink); }
.timerbtn svg { width: 26px; height: 26px; transform: rotate(-90deg); }
.timerbtn.run { background: rgba(194,54,28,.12); color: var(--dare); }
.outcome { display: flex; gap: 10px; }
.outcome button { height: 58px; border-radius: 20px; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.outcome .done { flex: 1.5; color: #fff; background: linear-gradient(180deg, #4cc28c, var(--good)); box-shadow: 0 4px 0 #1d6b48, 2px 9px 16px var(--shadow); position: relative; }
.outcome .done svg { width: 22px; height: 22px; }
.outcome .pass { flex: 1; }
.pts { font-family: var(--display); font-weight: 900; }

/* leaderboard */
.lb { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.lbrow { display: flex; align-items: center; gap: 10px; height: 52px; padding-inline: 10px 14px; border-radius: 16px; background: rgba(60,30,20,.06); }
.lbrow .rk { width: 22px; text-align: center; font-weight: 900; color: var(--ink-soft); }
.lbrow .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 15px; }
.lbrow .nm { flex: 1; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lbrow .st { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.lbrow .sc { font-family: var(--display); font-weight: 900; font-size: 20px; min-width: 2ch; text-align: center; }
.sheet h3.t { margin: 0; text-align: center; font-family: var(--display); font-weight: 900; font-size: 24px; color: var(--ink); line-height: 1.5; }

/* final */
#final { justify-content: center; align-items: stretch; text-align: center; overflow-y: auto; }
#final h2 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1.5; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 8px; height: 250px; }
.pcol { flex: 1; max-width: 120px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pcol .av { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 24px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 6px 14px rgba(0,0,0,.4); }
.pcol .nm { font-weight: 800; font-size: 14px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step { width: 100%; border-radius: 16px 16px 6px 6px; display: flex; flex-direction: column; align-items: center; padding-top: 10px; box-sizing: border-box; transform-origin: 50% 100%; }
.step .sc { font-family: var(--display); font-weight: 900; font-size: 26px; line-height: 1.3; }
.step .pl { font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.awards { display: grid; gap: 8px; }
.award { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; text-align: start; }
.award .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; position: relative; z-index: 1; }
.award .ic svg { width: 26px; height: 26px; }
.award div { position: relative; z-index: 1; min-width: 0; }
.award b { display: block; font-size: 15px; }
.award span { font-size: 13px; color: var(--ink-soft); }
.finalbtns { display: flex; gap: 10px; }
.finalbtns button { flex: 1; height: 56px; border-radius: 999px; font-family: var(--display); font-weight: 900; font-size: 18px; }
.finalbtns .gold { flex: 1.5; }

.toast { position: fixed; z-index: 50; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100% - 32px); top: calc(68px + env(safe-area-inset-top, 0px)); height: 42px; padding-inline: 18px; border-radius: 999px; display: flex; align-items: center; font-weight: 700; font-size: 14px; }
.toast[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<canvas id="room" aria-hidden="true"></canvas>

<!-- ================= SETUP ================= -->
<section class="screen" id="setup" aria-label="تنظیمات">
  <div class="brand s-in">
    <svg viewBox="0 0 150 64" aria-hidden="true">
      <g transform="translate(75 34) rotate(-18)">
        <path d="M-52 -11 h52 q8 0 14 5 l10 2 h14 v8 h-14 l-10 2 q-6 5 -14 5 h-52 q-9 0 -9 -11 t9 -11z" fill="rgba(0,0,0,.35)" transform="translate(5 8)"/>
        <path d="M-52 -11 h52 q8 0 14 5 l10 2 h14 v8 h-14 l-10 2 q-6 5 -14 5 h-52 q-9 0 -9 -11 t9 -11z" fill="#2f7d4f"/>
        <path d="M-50 -7 h48" stroke="#b9f0c8" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        <rect x="-38" y="-11" width="22" height="22" fill="#eaa632"/><rect x="-38" y="-11" width="22" height="5" fill="#ffd479"/>
        <rect x="38" y="-5" width="6" height="10" rx="1.5" fill="#c9c2b4"/>
      </g>
    </svg>
    <h1><span class="t">حقیقت</span> یا <span class="d">جرئت</span></h1>
    <p>بطری را بچرخان، ببین نوبت کیست</p>
  </div>
  <div class="panel ivory s-in">
    <div class="field">
      <span class="lbl" id="lblPlayers">بازیکن‌ها <small id="pcount"></small></span>
      <div class="players" id="players" role="group" aria-labelledby="lblPlayers"></div>
    </div>
    <div class="field">
      <span class="lbl" id="lblLevel">حال‌وهوای بازی</span>
      <div class="levels" id="levels" role="group" aria-labelledby="lblLevel"></div>
    </div>
    <div class="prefs">
      <div class="seg" id="segSound" role="group" aria-label="صدا"></div>
      <div class="seg" id="segMotion" role="group" aria-label="حرکت"></div>
    </div>
  </div>
  <button class="cta gold press s-in" id="btnStart">بچرخون!</button>
</section>

<!-- ================= TABLE ================= -->
<section class="screen" id="table" hidden aria-label="سفره‌ی بازی">
  <div class="topbar">
    <div class="chip ivory turnchip"><span>نوبت <b id="turnNum">۱</b></span><span class="lv" id="lvName"></span></div>
    <button class="ib ivory press" id="btnBoard" aria-label="جدول امتیاز"><svg viewBox="0 0 24 24" fill="#2a1a1a"><path d="M7 4h10v3a5 5 0 0 1-10 0z"/><path d="M5 5h2v2a2 2 0 0 1-2-2zM19 5h-2v2a2 2 0 0 0 2-2z" fill="none" stroke="#2a1a1a" stroke-width="1.6"/><rect x="10.5" y="11.5" width="3" height="4"/><rect x="8" y="15.5" width="8" height="3.5" rx="1"/></svg></button>
    <button class="ib ivory press" id="btnEnd" aria-label="پایان بازی"><svg viewBox="0 0 24 24" fill="none" stroke="#2a1a1a" stroke-width="2.4" stroke-linecap="round"><path d="M6 4v16"/><path d="M6 5h11l-2.5 4L17 13H6" fill="#c2361c" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="tablewrap"><canvas id="carpet" tabindex="0" role="application" aria-label="فرش و بطری؛ با کشیدن انگشت یا کلید فاصله بطری را بچرخان"></canvas></div>
  <p class="hint" id="hint">انگشتت را روی فرش بکش تا بطری بچرخد</p>
  <button class="spinbtn gold press" id="btnSpin"><svg viewBox="0 0 24 24" fill="none" stroke="#3b1d04" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>چرخاندن بطری</span></button>
</section>

<!-- ================= FINAL ================= -->
<section class="screen" id="final" hidden aria-label="پایان بازی">
  <h2 class="s-in">صدرنشین‌های امشب</h2>
  <div class="podium s-in" id="podium"></div>
  <div class="awards" id="awards"></div>
  <div class="finalbtns s-in"><button class="gold press" id="btnAgain">یک دور دیگر</button><button class="ivory press" id="btnSettings">تنظیمات</button></div>
</section>

<!-- ================= SHEETS ================= -->
<section class="sheet ivory" id="choose" hidden aria-label="انتخاب">
  <div class="who"><span class="av" id="chAv"></span><h3 id="chName"></h3></div>
  <p class="asker" id="chAsker"></p>
  <div class="choices">
    <button class="choice truth" id="pickTruth">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M8 32s9-15 24-15 24 15 24 15-9 15-24 15S8 32 8 32z" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><circle cx="32" cy="32" r="8" fill="#fff"/><circle cx="29.5" cy="29.5" r="2.6" fill="#2f4f9a"/></svg>
      <b>حقیقت</b><small>راستش را بگو · ۱ امتیاز</small>

$("btnBoard").addEventListener("click", () => {
  if (state !== "idle") return;
  $("lb").innerHTML = ranked().map((p, k) => `<div class="lbrow"><span class="rk">${fa(k + 1)}</span><span class="av" style="background:${p.color}">${esc(p.name.charAt(0))}</span><span class="nm">${esc(p.name)}</span><span class="st">${fa(p.truths)} حقیقت · ${fa(p.dares)} جرئت</span><span class="sc">${fa(p.score)}</span></div>`).join("");
  state = "board"; showSheet($("board"));
});
$("btnCloseBoard").addEventListener("click", async () => { await hideSheet($("board")); state = "idle"; });
$("btnEnd").addEventListener("click", () => { if (state !== "idle") return; state = "confirm"; showSheet($("confirmEnd")); });
$("btnEndNo").addEventListener("click", async () => { await hideSheet($("confirmEnd")); state = "idle"; });
$("btnEndYes").addEventListener("click", async () => { await hideSheet($("confirmEnd")); showFinal(); });

// ---------- final ----------
const AW = {
  brave: '<svg viewBox="0 0 24 24"><path d="M12 3c1.5 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 .5 2 1.5 3 2.5 3.5C11 7 11.5 5 12 3z" fill="#fff"/></svg>',
  honest: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg>',
  chick: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7" fill="#ffd479"/><circle cx="14.5" cy="11" r="1.2" fill="#2a1a1a"/><path d="M18 12.5l3 1-3 1z" fill="#e2741a"/><path d="M9 6c1-2 3-2 3 0" stroke="#e2741a" stroke-width="1.6" fill="none"/></svg>'
};
async function showFinal() {
  state = "final";
  const r = ranked(), top = [r[1], r[0], r[2]].filter(Boolean), H = { 0: 150, 1: 110, 2: 80 };
  $("podium").innerHTML = top.map(p => { const k = r.indexOf(p); return `<div class="pcol"><span class="av" style="background:${p.color}">${esc(p.name.charAt(0))}</span><span class="nm">${esc(p.name)}</span><div class="step ${k === 0 ? "gold" : "ivory"}" style="height:${H[k]}px" data-k="${k}"><span class="sc" data-v="${p.score}">۰</span><span class="pl">${["اول", "دوم", "سوم"][k]}</span></div></div>`; }).join("");
  const by = f => players.reduce((a, b) => f(b) > f(a) ? b : a, players[0]);
  const brave = by(p => p.dares), honest = by(p => p.truths), chick = by(p => p.chickens * 10 + (PASSES - p.passes));
  const aw = [];
  if (brave.dares) aw.push(["brave", "شجاع‌ترین", `${brave.name} · ${fa(brave.dares)} جرئت`, "var(--dare)"]);
  if (honest.truths) aw.push(["honest", "راستگوترین", `${honest.name} · ${fa(honest.truths)} حقیقت`, "var(--truth)"]);
  if (chick.chickens || chick.passes < PASSES) aw.push(["chick", "جوجه‌ی جمع", `${chick.name} · ${fa(chick.chickens + PASSES - chick.passes)} بار پاس`, "#b8740f"]);
  $("awards").innerHTML = aw.map(([ic, t, s, col]) => `<div class="award ivory s-in"><span class="ic" style="background:${col}">${AW[ic]}</span><div><b>${t}</b><span>${esc(s)}</span></div></div>`).join("");
  await go("final");
  // the steps rise in order third → second → first, then the scores run up, then the confetti
  const steps = [...$("podium").querySelectorAll(".step")].sort((a, b) => b.dataset.k - a.dataset.k);
  for (const st of steps) {
    if (!reduce()) st.animate([{ transform: "scaleY(0)" }, { transform: "scaleY(1)" }], { duration: 420, easing: B.back, fill: "backwards" });
    const v = st.querySelector(".sc"); setTimeout(() => countTo(v, +v.dataset.v), reduce() ? 0 : 250);
    tone(523 * Math.pow(2, (2 - st.dataset.k) * 4 / 12), 0.3, 0.05, "triangle");
    await wait(330);
  }
  const first = $("podium").querySelector('[data-k="0"]');
  if (first) { const rr = first.getBoundingClientRect(); confetti(rr.left + rr.width / 2, rr.top, 110); }
  sfx.fanfare();
}
function countTo(el, to) {
  if (reduce() || !to) { el.textContent = fa(to); return; }
  const t0 = performance.now(); const step = () => { const p = clamp01((performance.now() - t0) / 500); el.textContent = fa(Math.round(to * eOC(p))); if (p < 1) requestAnimationFrame(step); else pop(el, 1.25); }; step();
}
$("btnAgain").addEventListener("click", async () => { ac(); newGame(); $("turnNum").textContent = "۱"; state = "idle"; await go("table"); hint(idleHint()); $("btnSpin").disabled = false; });
$("btnSettings").addEventListener("click", () => { buildSetup(); state = "setup"; go("setup"); });

// ================= setup =================
function seg(el, values, curV, fmt, onPick) {
  el.innerHTML = values.map(v => `<button type="button" aria-pressed="${v === curV}" data-v="${v}">${fmt(v)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return; ac(); el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); onPick(b.dataset.v); tone(900, 0.05, 0.03); };
}
function renderPlayers() {
  const n = settings.players.length;
  $("pcount").textContent = `${fa(n)} نفر · ۲ تا ۱۰`;
  $("players").innerHTML = settings.players.map((nm, i) => `<div class="prow"><span class="dot" style="background:${COLORS[i % COLORS.length]}">${fa(i + 1)}</span><input id="p${i}" value="${esc(nm)}" maxlength="14" aria-label="نام بازیکن ${fa(i + 1)}"><button class="rm" type="button" data-i="${i}" aria-label="حذف ${esc(nm)}"${n <= 2 ? " disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`).join("") +
    (n < 10 ? `<button class="addp" type="button" id="addP">+ افزودن بازیکن</button>` : "");
}
$("players").addEventListener("input", e => { const i = +e.target.id.slice(1); settings.players[i] = e.target.value; save(); });
$("players").addEventListener("click", e => {
  const rm = e.target.closest(".rm"), add = e.target.closest("#addP"); ac();
  if (rm && settings.players.length > 2) { settings.players.splice(+rm.dataset.i, 1); renderPlayers(); tone(500, 0.06, 0.03); save(); }
  if (add) { settings.players.push(""); renderPlayers(); const inp = $("p" + (settings.players.length - 1)); inp.focus(); pop(inp.parentElement, 1.05); tone(990, 0.06, 0.03); save(); }
});
function buildSetup() {
  renderPlayers();
  $("levels").innerHTML = LEVELS.map(l => `<button type="button" class="lvl" data-l="${l.id}" aria-pressed="${settings.level === l.id}"><span class="ic">${l.icon}</span><span><b>${l.name}</b><span>${l.desc}</span></span></button>`).join("");
  seg($("segSound"), ["on", "off"], soundOn ? "on" : "off", v => v === "on" ? "صدا روشن" : "بی‌صدا", v => { soundOn = v === "on"; save(); });
  seg($("segMotion"), ["auto", "on", "off"], motionMode, v => ({ auto: "حرکت خودکار", on: "روشن", off: "خاموش" })[v], v => { motionMode = v; save(); });
}
$("levels").addEventListener("click", e => { const b = e.target.closest(".lvl"); if (!b) return; ac(); settings.level = b.dataset.l; $("levels").querySelectorAll(".lvl").forEach(x => x.setAttribute("aria-pressed", x === b)); pop(b, 1.03); tone(800, 0.06, 0.03); save(); });
$("btnStart").addEventListener("click", async () => {
  ac();
  const names = settings.players.map((s, i) => s.trim() || `بازیکن ${fa(i + 1)}`);
  if (names.length < 2) { toast("دست‌کم دو بازیکن لازم است"); return; }
  settings.players = names; save(); newGame();
  $("lvName").textContent = "· " + LEVELS.find(l => l.id === settings.level).name; $("turnNum").textContent = "۱";
  state = "idle"; await go("table"); hint(idleHint()); $("btnSpin").disabled = false;
  // seats arrive around the carpet
  if (!reduce()) players.forEach((p, i) => { p.pop = tw(0, 1, performance.now() + 150 + i * 70, 420, eOB); });
});

// ---------- toast / persistence ----------
let toastT = 0;
function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT);
  if (!reduce()) el.animate([{ transform: "translateY(-24px) scale(.94)" }, { transform: "none" }], { duration: 260, easing: B.back });
  toastT = setTimeout(() => { if (reduce()) { el.hidden = true; return; } el.animate([{ transform: "none" }, { transform: "translateY(-140px)" }], { duration: 220, easing: B.in }).finished.then(() => el.hidden = true); }, 1900);
}
const live = $("live");
function save() { store.set({ settings, soundOn, motionMode }); }
const saved = store.get();
if (saved) { if (saved.settings) settings = { ...settings, ...saved.settings }; soundOn = saved.soundOn !== false; motionMode = saved.motionMode || "auto"; }

// ---------- loop ----------
let lastT = performance.now();
function frame(now) { const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; drawTable(now); drawFx(now, dt); requestAnimationFrame(frame); }
buildSetup(); layout(); go("setup");
addEventListener("resize", layout);
document.fonts?.ready?.then(() => layout());
window.__td = { get state() { return state; }, get players() { return players; }, spin: w => startSpin(w), pick, done: () => resolve(true), pass: () => resolve(false) };
requestAnimationFrame(frame);
})();
</script>
